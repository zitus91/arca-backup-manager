services:
  php-fpm:
    image: backup-manager-php:8.3
    container_name: php_fpm_backup
    restart: unless-stopped
    working_dir: /var/www/html/backup
    environment:
      APP_DIR: /var/www/html/backup
      PHP_TEMP_DIR: /tmp/php
    tmpfs:
      - /tmp
    volumes:
      - /var/www/backup/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - /var/www/backup/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - internal

  laravel-scheduler:
    image: backup-manager-php:8.3
    container_name: laravel_scheduler
    restart: unless-stopped
    working_dir: /var/www/html/backup
    environment:
      APP_DIR: /var/www/html/backup
      PHP_TEMP_DIR: /tmp/php
    tmpfs:
      - /tmp
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - /var/www/backup/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - /var/www/backup/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - php-fpm
    networks:
      - internal

  laravel-worker:
    image: backup-manager-php:8.3
    container_name: laravel_worker
    restart: unless-stopped
    working_dir: /var/www/html/backup
    environment:
      APP_DIR: /var/www/html/backup
      PHP_TEMP_DIR: /tmp/php
    tmpfs:
      - /tmp
    command: php artisan queue:work --verbose --tries=3 --timeout=3600 --sleep=3 --max-time=3600
    volumes:
      - /var/www/backup/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - /var/www/backup/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - php-fpm
    networks:
      - internal

  reverb:
    image: backup-manager-php:8.3
    container_name: laravel_reverb
    restart: unless-stopped
    working_dir: /var/www/html/backup
    environment:
      APP_DIR: /var/www/html/backup
      PHP_TEMP_DIR: /tmp/php
    extra_hosts:
      - "s3.zitus.it:130.25.167.122"
    tmpfs:
      - /tmp
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - /var/www/backup/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - /var/www/backup/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - php-fpm
      - redis
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: redis_backup
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /var/www/backup/redis:/data
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_backup
    restart: unless-stopped
    volumes:
      - /var/www/backup/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/www/backup/nginx/conf.d:/etc/nginx/conf.d:ro
      - /var/www/backup/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - php-fpm
      - reverb
    networks:
      - internal
      - webproxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite_web_gui
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: database.sqlite
      EXTRA_ARGS: -r
    volumes:
      - /var/www/backup/app/database:/data
    networks:
      - internal
      - webproxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  webproxy:
    external: true
  internal:
    external: true
