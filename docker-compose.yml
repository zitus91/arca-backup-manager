services:
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backup_manager_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
      - ./.env:/var/www/html/.env:ro
    networks:
      - backend
      - frontend

  laravel-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backup_manager_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work --verbose --no-interaction
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
      - ./.env:/var/www/html/.env:ro
    depends_on:
      - php-fpm
    networks:
      - backend

  laravel-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backup_manager_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=1 --timeout=3600 --sleep=3 --max-time=0 --memory=512
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
      - ./.env:/var/www/html/.env:ro
    depends_on:
      - php-fpm
    networks:
      - backend

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backup_manager_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    depends_on:
      - php-fpm
      - redis
    networks:
      - backend
      - frontend

  redis:
    image: redis:7-alpine
    container_name: backup_manager_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: backup_manager_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - php-fpm
      - reverb
    networks:
      - frontend

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: backup_manager_sqlite_web
    restart: unless-stopped
    environment:
      - SQLITE_DATABASE=database.sqlite
      - EXTRA_ARGS=-r
    volumes:
      - ./database:/data:ro
    ports:
      - "${SQLITE_WEB_PORT:-8082}:8080"
    networks:
      - frontend

volumes:
  redis_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
